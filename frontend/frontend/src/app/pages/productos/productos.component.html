<h2>Productos</h2>

<app-alerta [mensaje]="error()" />

<form (ngSubmit)="guardar()">
  <label>
    Nombre
    <input name="nombre" [(ngModel)]="form.nombre" required>
  </label>
  <label>
    Precio
    <input name="precio" type="number" step="0.01" [(ngModel)]="form.precio" required>
  </label>
  <label>
    Stock
    <input name="stock" type="number" [(ngModel)]="form.stock" required>
  </label>
  <label>
    Categoría
    <select name="categoriaId" [(ngModel)]="form.categoriaId" required>
      <option [ngValue]="0">Selecciona una categoría</option>
      @for (c of categorias(); track c.id) {
        <option [ngValue]="c.id">{{ c.nombre }}</option>
      }
    </select>
  </label>
  <label>
    <span><input name="estado" type="checkbox" [(ngModel)]="form.estado"> Activo</span>
  </label>
  <div class="acciones">
    <button type="submit">{{ editandoId() === null ? 'Agregar' : 'Guardar cambios' }}</button>
    @if (editandoId() !== null) {
      <button type="button" class="gris" (click)="cancelar()">Cancelar</button>
    }
  </div>
</form>

<table>
  <thead>
    <tr><th>Id</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Categoría</th><th>Estado</th><th></th></tr>
  </thead>
  <tbody>
    @for (p of productos(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.precio | precioBs }}</td>
        <td [appStockBajo]="p.stock">{{ p.stock }}</td>
        <td>{{ p.nombreCategoria }}</td>
        <td>{{ p.estado | estado }}</td>
        <td class="acciones">
          <button type="button" (click)="editar(p)">Editar</button>
          <button type="button" class="rojo" (click)="eliminar(p)">Eliminar</button>
        </td>
      </tr>
    } @empty {
      <tr><td colspan="7">No hay productos registrados.</td></tr>
    }
  </tbody>
</table>
